[package]
name = "agentx-desktop"
version = "0.1.0"
description = "AgentX desktop shell (Tauri) — loads the AgentX web app in a native window."
authors = ["AgentX contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tauri: the shell itself. No other Tauri plugins are used besides the two
# below, both of which mirror behaviour the old Electron main.js had:
#   - tauri-plugin-dialog: native error dialogs (Electron dialog.showErrorBox)
#   - tauri-plugin-opener: open external links in the system browser
#     (Electron shell.openExternal)
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
url = "2"
